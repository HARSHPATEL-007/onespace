version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: n0va
      POSTGRES_PASSWORD: n0va_secret
      POSTGRES_DB: n0va
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n0va"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://n0va:n0va_secret@postgres:5432/n0va
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "cd /app/packages/db && npx prisma db push --skip-generate && cd /app && pnpm dev"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    # Optional: requires services/chat-gateway source (not in repo for dev SSE mode).
    # infra/docker-compose.yml + SSE fallback works without this. Enable only if you provide Rust gateway.
    build:
      context: ./services/chat-gateway
      dockerfile: Dockerfile
    profiles: ["gateway"]
    ports:
      - "8080:8080"
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8080
      DATABASE_URL: postgresql://n0va:n0va_secret@postgres:5432/n0va
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
      NEXTJS_API_URL: http://web:3000
      RUST_LOG: info,chat_gateway=debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  smtp:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

volumes:
  pgdata:
  redisdata:
